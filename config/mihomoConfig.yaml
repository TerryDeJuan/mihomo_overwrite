  - name: 'AI'
    <<: *group_common_select
    proxies: ['Media_Select', 'US_Select', 'Media_Auto', 'Proxy', 'US_Auto', 'Direct', 'Auto_All', 'JP_KR_Auto', 'TW_SG_Auto', 'EU_Auto', 'HK_Auto', 'JP_KR_Select', 'TW_SG_Select', 'EU_Select', 'HK_Select', 'Block']
