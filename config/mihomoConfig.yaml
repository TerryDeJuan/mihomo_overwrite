# --- common ---
proxy_providers_common:
  &proxy_providers_common {
    type: http,
    interval: 86400,
    proxy: DIRECT,
    health-check: { enable: true, url: 'https://g.cn/generate_204', interval: 600, lazy: true },
  }

# Global node exclusion filter
# global_exclude_filter:
#   &global_exclude_filter {
#     exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|剩余|公益|发布|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置)',
#   }

# Subscription providers. Copy provider1 to add another provider, then change its URL, path, and additional-prefix.
# proxy-providers:
#   provider1:
#     <<: [*proxy_providers_common, *global_exclude_filter]
#     url: '' # Put the subscription URL between the single quotes.
#     age-secret-key: '' # If decryption is required, put the key between the single quotes; otherwise leave this field empty.
#     path: ./proxy_provider/provider1.yaml
#     override:
#       additional-prefix: 'p1 | ' # Prefix node names to prevent collisions between subscriptions.

# Example provider block; keep indentation aligned with provider1.
# provider2:
#   <<: [*proxy_providers_common, *global_exclude_filter]
#   url: ''
#   age-secret-key: ''
#   path: ./proxy_provider/provider2.yaml
#   override:
#     additional-prefix: 'p2 | '

# Node definitions; custom nodes may be added here.
# proxies:
#   - { name: '🇨🇳 直连 | IPv4优先', type: direct, ip-version: ipv4-prefer }
#   - { name: '🇨🇳 直连 | IPv6优先', type: direct, ip-version: ipv6-prefer }
#   - { name: '🇨🇳 直连 | 双栈', type: direct }

