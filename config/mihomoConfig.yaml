# --- Proxy group common configuration ---
# Load balancing is intentionally omitted; this config uses select and url-test groups only.
group_common:
  group_common_select:
    &group_common_select {
      type: select,
      interval: 300,
      timeout: 3000,
      max-failed-times: 3,
      empty-fallback: REJECT,
      url: 'https://www.gstatic.com/generate_204',
      lazy: true,
    }
  group_common_auto:
    &group_common_auto {
      type: url-test,
      interval: 300,
      timeout: 3000,
      max-failed-times: 3,
      empty-fallback: REJECT,
      url: 'https://www.gstatic.com/generate_204',
      lazy: true,
      tolerance: 150,
      include-all: true,
      exclude-type: 'DIRECT',
    }

# --- Group filters ---
# Shared by each region/service Select and Auto pair.
group_filter:
  US_filter: &US_filter { filter: '(?i:\bUS[A]?\b|广美|美|\bUS|纽约|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|🇨🇦|\bCA|Canada|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇸|United States|UnitedStates|America|United.*?States|美国|[^-]美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\bLAS|\bSEA|\bLAX|\bSJC|\bSFO|\bMIA|\bBOS|\bDFW|Default|\bSLC)' }
  JP_KR_filter: &JP_KR_filter { filter: '(?i:\bJP[N]?\b|广日|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|Japan|Tokyo|Osaka|Saitama|日本|东京|大阪|埼玉|[^-]日|NRT|广韩|韩国|\bKR|首尔|春川|🇰🇷|Korea)' }
  TW_SG_filter: &TW_SG_filter { filter: '(?i:\bTW[N]?\b|Taiwan|新北|彰化|\bCHT\b|台湾|[^-]台|\bHINET\b|广台|台湾|Tai Wan|TaiWan|\bTPE|Taipei|广台|台湾|\bTW|Tai Wan|🇹🇼|TaiWan|\bTPE|Taipei|广新|新加坡|\bSG|坡|狮城|🇸🇬|Singapore|Singapore|新加坡|狮城|[^-]新|\bSIN)' }
  Media_filter: &Media_filter { filter: '(美|\bUS|纽约|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇨🇦|\bCA|Canada|🇺🇸|United States|UnitedStates|解锁|\bNF|Netflix|奈飞|\bLAS|\bSEA|\bLAX|\bSJC|\bSFO|\bMIA|\bBOS|\bDFW|Default|\bSLC|\bJP|Japan|Tokyo|Osaka|Saitama|🇯🇵|日本|东京|大阪|埼玉|[^-]日|NRT)' }
  EU_filter: &EU_filter { filter: '(🇪🇺|也纳|克兰|比利时|尔兰|立陶宛|冰岛|秘鲁|耳其|利亚|埃及|希腊|斯洛伐克|芬兰|英国|德国|意大|法国|罗斯|瑞士|瑞典|荷兰|比亚|班牙|🇮🇹|🇫🇷|Ita|Fran|🇰🇿|Kaz|🇩🇪|Ger|🇬🇧|Kin|^UK|Brit|Tur|🇹🇷|🇵🇰|Paki|🇦🇺|Aus|🇨🇭|Swi|🇷🇺|Rus|Ukr|🇺🇦|Est|🇪🇪|Neth|🇳🇱|\bRU|\bFR|France|Paris|巴黎|CDG|^ES|🇪🇸|^IL|🇮🇱|^SE|🇸🇪|🇬🇷|i:\bGR[P]?\b)' }
  HK_filter: &HK_filter { filter: '(HKBN|港|广港|香港|\bHK|Hong Kong|🇭🇰|HongKong|i:\bHK[G]?\b|Hong.*?Kong|\bHKT\b|\bHKBN\b|\bHGC\b|\bWTT\b|\bCMI\b|[^-]港)' }
  DMCA_filter: &DMCA_filter { filter: '(Neth|🇳🇱|Lux|罗斯|🇷🇺|Rus|广新|新加坡|坡|狮城|🇸🇬|Singapore|Mala|马来|立陶宛|利亚|Bul|瑞典|荷兰|比亚|Kaz|Paki|Swi|Est|🇪🇪|\bRU\b|新加坡|\bSG|坡|狮城|🇸🇬|Singapore|i:\bSG[P]?\b|Singapore|新加坡|狮城|[^-]新|\bSIN|🇪🇸|i:\bES[P]?\b|i:\bDE[U]?\b|🇩🇪)' }

# --- Proxy groups from groups.toml ---
proxy-groups:
  - name: 'Proxy'
    <<: *group_common_select
    proxies: ['US_Auto', 'US_Select', 'Auto_All', 'Media_Auto', 'Media_Select', 'Direct', 'JP_KR_Auto', 'TW_SG_Auto', 'EU_Auto', 'HK_Auto', 'DMCA_Auto', 'JP_KR_Select', 'TW_SG_Select', 'EU_Select', 'HK_Select', 'DMCA_Select', 'Block']
    include-all: true
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png'
  - name: 'Streaming_Media'
    <<: *group_common_select
    proxies: ['Media_Select', 'Media_Auto', 'Proxy', 'US_Auto', 'US_Select', 'JP_KR_Auto', 'JP_KR_Select', 'Auto_All', 'TW_SG_Auto', 'EU_Auto', 'HK_Auto', 'TW_SG_Select', 'EU_Select', 'HK_Select', 'Direct', 'Block']
